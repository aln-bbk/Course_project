  spring:
    application:
      name: course_project

    cache:
      type: redis
      redis:
        time-to-live: 10m

    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false

    liquibase:
      enabled: true
      change-log: classpath:db/changelog/db.changelog-master.yml

  management:
    endpoints:
      web:
        exposure:
          include: health,info
